name: Build APK

on:
  push:
    branches:
      - claude/animal-voice-translator-app-HFmSj
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check network & Android SDK
        run: |
          echo "=== Java version ==="
          java -version
          echo "=== Android SDK root ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/build-tools/" 2>/dev/null || echo "no build-tools dir"
          echo "=== Network check ==="
          curl -s -o /dev/null -w "Google Maven: %{http_code}\n" \
            "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml" || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      - name: Check build result
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "BUILD SUCCEEDED"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "BUILD FAILED — last 60 lines of log:"
            tail -60 build.log
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AnimalVoiceTranslator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
